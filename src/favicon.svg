<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7b2fff"/>
      <stop offset="100%" stop-color="#ff2daa"/>
    </linearGradient>
  </defs>
  
  <!-- Dark background with rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#0a0a0f"/>
  
  <!-- Gradient border -->
  <rect x="4" y="4" width="56" height="56" rx="10" fill="none" stroke="url(#grad)" stroke-width="2"/>
  
  <!-- Code tag symbol: </> -->
  <g fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left angle bracket < -->
    <polyline points="24,20 14,32 24,44"/>
    <!-- Right angle bracket > -->
    <polyline points="40,20 50,32 40,44"/>
    <!-- Forward slash / -->
    <line x1="36" y1="18" x2="28" y2="46"/>
  </g>
</svg>
